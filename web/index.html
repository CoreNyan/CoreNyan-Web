<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeCore-Mind</title>
  <link rel="stylesheet" href="css/doodle.css">
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="brand-section">
      <div class="brand-avatar-box">
        <img id="appAvatarImg" src="assets/CoreNyan.png" alt="App" class="brand-avatar" onerror="this.src='assets/doodle/doodle_1.png'">
        <div class="brand-info-wrap">
          <div id="appNameText" class="brand-title">CoreNyan</div>
        </div>
      </div>
      <button id="toggleSidebarBtn" class="sidebar-toggle-btn" title="折叠侧栏">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>

    <!-- Quick action buttons: 新建会话 与 新建分组 并行等宽对称排列 -->
    <div class="sidebar-action-wrap">
      <button id="newChatBtn" class="new-chat-btn" style="flex: 1;">
        + 新建会话
      </button>
      <button id="btnNewGroup" class="new-chat-btn btn-secondary-action" style="flex: 1;" title="新建会话分组">
        + 新建分组
      </button>
    </div>

    <div class="search-wrapper">
      <input type="text" id="sessionSearch" class="search-input" placeholder="搜索会话...">
    </div>

    <!-- Grouped Active Sessions List -->
    <div id="sessionList" class="session-list">
      <!-- Groups and Sessions rendered dynamically -->
    </div>

    <!-- Recycle Bin Entry -->
    <div class="recycle-entry-bar">
      <button id="btnOpenRecycle" class="recycle-btn">
        <span>回收站</span>
        <span id="recycleCountBadge" class="recycle-badge">0</span>
      </button>
    </div>

    <!-- High-impact prominent footer button: 设置 独占底部 -->
    <div class="sidebar-footer">
      <button id="btnSettings" class="footer-btn footer-btn-standalone" style="width: 100%; justify-content: center; display: flex; align-items: center; gap: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        设置
      </button>
    </div>
  </aside>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" style="display: none;"></div>

  <!-- Main Chat Section -->
  <main class="main-chat">
    <header class="top-bar">
      <div class="top-left-wrap">
        <button id="expandSidebarBtn" class="expand-sidebar-btn" title="展开侧栏" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span id="currentSessionTitle" class="top-title">新会话</span>
      </div>

      <div class="top-controls">
        <div id="currentUserBadge" class="user-badge-header" style="display: none;">
          <img id="currentUserAvatarImg" class="card-avatar-sm" src="assets/doodle/doodle_1.png" alt="Avatar" style="width: 22px; height: 22px; border-radius: 5px; margin-right: 4px;">
          <span id="currentUserNameLabel">管理员</span>
          <span id="btnLogout" class="logout-link">退出</span>
        </div>
      </div>
    </header>

    <section id="chatMessages" class="chat-messages">
      <!-- Chat bubbles rendered dynamically -->
    </section>

    <!-- Resizable Drag Handles for Chat Width (Cursor: ew-resize / col-resize) -->
    <div id="chatResizeHandleLeft" class="chat-resize-handle left" title="按住拖拽调节聊天区域宽度"></div>
    <div id="chatResizeHandleRight" class="chat-resize-handle right" title="按住拖拽调节聊天区域宽度"></div>

    <!-- DSH Standard Floating Composer Container -->
    <div class="composer-container">
      <div class="composer-card">
        <div id="imagePreviewBar" class="image-preview-bar" style="display: none;"></div>

        <div class="composer-input-row">
          <textarea id="chatInput" class="composer-textarea" placeholder="输入任务指令... 支持拖拽文件、粘贴截图" rows="1"></textarea>
        </div>

        <div class="composer-toolbar">
          <div class="toolbar-left">
            <div class="composer-pill-group model-custom-picker-wrap">
              <span class="pill-label">模型</span>
              <button type="button" id="modelPickerTrigger" class="model-picker-trigger">
                <span id="modelPickerCurrentText">选择模型</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <input type="hidden" id="modelSelect" value="">
              <!-- Custom Rich Popover Dropdown -->
              <div id="modelPickerDropdown" class="model-picker-dropdown">
                <div class="model-picker-search-wrap">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input type="text" id="modelPickerSearch" placeholder="搜索模型或厂商..." autocomplete="off">
                </div>
                <div id="modelPickerList" class="model-picker-list"></div>
              </div>
            </div>

            <div class="composer-pill-group">
              <span class="pill-label">思考</span>
              <select id="thinkingSelect" class="composer-select">
                <option value="off">off</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="max">max</option>
              </select>
            </div>

            <label class="toolbar-icon-btn" title="上传图片或文件">
              <input type="file" id="fileInput" accept="image/*" style="display: none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
            </label>
          </div>

          <div class="toolbar-right">
            <!-- Context Ring Indicator in Composer Toolbar: Click to Compact Context -->
            <div class="context-ring-container" id="btnCompact" title="点击执行上下文压缩摘要&#10;鼠标悬停查看占用详情">
              <svg class="context-ring-svg" width="26" height="26" viewBox="0 0 36 36">
                <path class="context-ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3.5" />
                <path id="contextRingProgress" class="context-ring-val" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--color-cyan)" stroke-width="3.5" stroke-dasharray="15, 100" stroke-linecap="round" />
              </svg>
              <span id="contextRingText" class="context-ring-text">15%</span>
            </div>

            <!-- Intervene Actions when Task is running (1:1 DSH Steer / Queue / Stop) -->
            <div id="composerInterveneGroup" class="composer-intervene-group">
              <button id="btnSteer" class="btn-steer" title="直接插队打断当前执行，优先响应">
                <span>⚡ 直接插话</span>
              </button>
              <button id="btnQueue" class="btn-queue" title="排入执行队列，本轮结束后自动执行">
                <span>⏳ 排队插话</span>
              </button>
              <button id="btnStopTask" class="btn-stop-task" title="终止当前任务">
                <span>■ 停止</span>
              </button>
            </div>

            <button id="sendBtn" class="composer-send-btn">
              <span>发送</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Right-Click Context Menu for Sessions -->
  <div id="sessionContextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" id="ctxPin">置顶会话</div>
    <div class="context-menu-item" id="ctxRename">重命名</div>
    <div class="context-menu-item submenu-parent" id="ctxMoveGroup">
      移动到组...
      <div class="context-submenu" id="ctxSubmenuGroups"></div>
    </div>
    <div class="context-menu-item" id="ctxArchive">归档至回收站</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item danger" id="ctxDelete">彻底删除</div>
  </div>

  <!-- Right-Click Context Menu for Groups -->
  <div id="groupContextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" id="ctxGroupRename">重命名组</div>
    <div class="context-menu-item danger" id="ctxGroupDelete">删除组</div>
  </div>

  <!-- Right-Click Context Menu for File Manager (Skills & Memory) -->
  <div id="fmContextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" id="ctxFmRename">重命名 (F2)</div>
    <div class="context-menu-item" id="ctxFmCopy">复制 (Ctrl+C)</div>
    <div class="context-menu-item" id="ctxFmPaste">在此粘贴 (Ctrl+V)</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item danger" id="ctxFmDelete">删除文件</div>
  </div>

  <!-- High-Fidelity Modal Dialog -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">标题</div>
        <button id="modalClose" class="modal-close">&times;</button>
      </div>
      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotice" class="toast-notice"></div>

  <!-- Fullscreen Login Dialog for Blessing Skin Administrators -->
  <div id="loginOverlay" class="login-overlay" style="display: none;">
    <div class="login-card">
      <div class="login-header">
        <img src="assets/CoreNyan.png" class="login-avatar" alt="Avatar">
        <div class="login-title">FreeCore-Mind</div>
        <div class="login-sub">请使用 FreeCore 皮肤站管理员账户验证登录</div>
      </div>
      <div id="loginError" class="login-error"></div>
      <button id="btnLauncherLogin" class="btn-submit" style="width: 100%; text-align: center; justify-content: center; padding: 10px 0;">使用 FreeCore-Account 授权登录</button>
      <div style="margin-top:10px;text-align:center;font-size:12px;color:#8b949e">无需在此输入密码，点击后将在 FreeCore-Account 完成授权</div>
    </div>
  </div>

  <!-- Fullscreen Image Lightbox Viewer -->
  <div id="imageLightbox" class="lightbox-overlay" style="display: none;">
    <div class="lightbox-toolbar">
      <button id="lbBtnDownload" class="lightbox-btn" title="下载原图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        下载原图
      </button>
      <button id="lbBtnClose" class="lightbox-btn" title="关闭 (Esc)">
        &times; 关闭
      </button>
    </div>
    <div class="lightbox-image-container" id="lightboxContainer">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Full Preview">
    </div>
  </div>

  <script src="js/marked.min.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
